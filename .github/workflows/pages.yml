# Publishes the user guide (en + de) to GitHub Pages.
#
# Same Zensical build as the offline help pack in release.yml, laid out as
# <site>/en/, <site>/de/ and the root redirect docs/userguide/index.html.
# Every link in the guide is relative (use_directory_urls = false), so the
# site works under the /SavegameBunker/ project-pages path unchanged.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/userguide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build user guide (en, de)
        run: |
          set -euo pipefail
          pip install zensical==0.1.1
          rm -rf _site
          mkdir -p _site
          for lang in en de; do
            (cd "docs/userguide/$lang" && python -m zensical build)
            mkdir -p "_site/$lang"
            cp -r "docs/userguide/$lang/site/." "_site/$lang/"
          done
          cp docs/userguide/index.html _site/index.html
          touch _site/.nojekyll
          test -f _site/en/index.html
          test -f _site/de/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
