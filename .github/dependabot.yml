# Keeps the two shipping NuGet packages, the test packages and the SHA-pinned
# GitHub Actions current. Monthly, grouped, so updates arrive as few PRs.
# Security updates are separate and arrive as soon as an advisory is published.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
